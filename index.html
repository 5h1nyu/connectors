    <script>
      // Use the saved colour theme straight away, so the page doesn't flash the default one first.
      try {
        var t = localStorage.getItem('mtg-tracker:theme') || 'midnight'
        var vars = JSON.parse(localStorage.getItem('mtg-tracker:theme-vars') || '{}')
        document.documentElement.dataset.theme = t.indexOf('mana-') === 0 ? 'mana' : t
        for (var k in vars) document.documentElement.style.setProperty(k, vars[k])
      } catch (e) {}
    </script>
